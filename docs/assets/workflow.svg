<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="382" viewBox="0 0 1040 382" role="img" aria-labelledby="title desc">
<title id="title">From product idea to verified outcome</title><desc id="desc">Define: vision, research and problem framing, outcome criteria. Try: alternatives and storyboards, standalone prototype, synthetic study and revision. Build: refined design and criteria, implementation and review, runtime verification. Review and revise at consequential decisions.</desc>
