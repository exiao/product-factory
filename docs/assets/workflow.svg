<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc"><title id="title">Agent work and your judgment, connected by Artifact Review</title><desc id="desc">Define: research, sources and gaps, guided by evidence and questions you supply. Explore: alternatives and storyboards, guided by direction. Test: playable prototype and task checks, guided by hands-on trials and challenges to assumptions. Deliver: code and test results, guided by scope and acceptance. Artifact Review connects work to inspect, your feedback, and revised work.</desc><rect width="1040" height="530" rx="16" fill="#f5f6f2"/><g font-family="Arial,sans-serif"><text x="32" y="46" font-size="22" font-weight="700" fill="#253b2e">From an idea to a product you can use.</text><text x="32" y="153" font-size="14" font-weight="700" fill="#526858">Agent</text><text x="32" y="259" font-size="14" font-weight="700" fill="#526858">You</text>
