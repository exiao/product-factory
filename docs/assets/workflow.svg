<text x="392" y="65" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#32614e">02 / TRY</text>
<text x="392" y="110" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#21382e">Does the approach work?</text>
