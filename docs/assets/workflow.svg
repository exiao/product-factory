<circle cx="396" cy="165" r="3" fill="#6c8978"/><text x="412" y="170" font-family="Arial,sans-serif" font-size="17" fill="#41584c">Alternatives &amp; storyboards</text>
<circle cx="396" cy="207" r="3" fill="#6c8978"/><text x="412" y="212" font-family="Arial,sans-serif" font-size="17" fill="#41584c">Standalone prototype</text>
<circle cx="396" cy="249" r="3" fill="#6c8978"/><text x="412" y="254" font-family="Arial,sans-serif" font-size="17" fill="#41584c">Synthetic study &amp; revision</text>
