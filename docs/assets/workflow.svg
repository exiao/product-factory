<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="466" viewBox="0 0 1040 466" role="img" aria-labelledby="title desc"><title id="title">The agent creates options. You choose what moves forward.</title><desc id="desc">Define: many visions and directions, one chosen vision. Explore: many ideas, wireframes and storyboards, one chosen approach. Decide: many prototypes and designs, one chosen design. Deliver: working code with test results, one accepted release. Artifact Review carries feedback into revised options.</desc><rect width="1040" height="466" rx="16" fill="#f5f6f2"/><g font-family="Arial,sans-serif"><text x="32" y="47" font-size="23" font-weight="700" fill="#253b2e">The agent creates options. You choose what moves forward.</text><text x="26" y="175" font-size="14" font-weight="700" fill="#526858">Agent</text><text x="26" y="330" font-size="14" font-weight="700" fill="#526858">You</text>
